# ---------------------------------------------------------------------------
# estadisticas.honorlab.dev — proxy inverso con TLS
#
# Instalacion:
#   sudo cp deploy/nginx/estadisticas.honorlab.dev.conf \
#           /etc/nginx/sites-available/estadisticas.honorlab.dev
#   sudo ln -sf /etc/nginx/sites-available/estadisticas.honorlab.dev \
#               /etc/nginx/sites-enabled/estadisticas.honorlab.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# Lo normal es no copiarlo a mano: deploy/install.sh lo instala, ajusta el
# dominio y adapta la sintaxis de HTTP/2 a la version de nginx del servidor.
# Mientras no exista el certificado, install.sh deja solo el bloque HTTP.
# ---------------------------------------------------------------------------

# Zona de limitacion de peticiones compartida (se declara una sola vez).
limit_req_zone $binary_remote_addr zone=estadisticas_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name estadisticas.honorlab.dev;

    # Validacion de certificados de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demas viaja cifrado.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name estadisticas.honorlab.dev;

    # --- Certificados (los coloca certbot) --------------------------------
    ssl_certificate     /etc/letsencrypt/live/estadisticas.honorlab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estadisticas.honorlab.dev/privkey.pem;

    # --- Parametros TLS ----------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EstadisticasSSL:10m;
    ssl_session_tickets off;
    # OCSP stapling queda desactivado a proposito: Let's Encrypt retiro su
    # servicio OCSP en 2025 y sus certificados ya no traen la URL, asi que
    # activarlo solo produce un aviso en cada arranque de nginx.

    # --- Cabeceras de seguridad -------------------------------------------
    # HSTS: solo se activa cuando el certificado ya funciona correctamente.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # El tablero maneja informacion interna: no debe indexarse.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # --- Limites ------------------------------------------------------------
    # El reporte mensual ronda los 15 MB; se deja holgura para meses grandes.
    client_max_body_size 100M;
    client_body_timeout 300s;

    access_log /var/log/nginx/estadisticas.access.log;
    error_log  /var/log/nginx/estadisticas.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Carga de archivos --------------------------------------------------
    # nginx recibe el archivo completo antes de pasarlo a la aplicacion (el
    # buffering por defecto). Sin el, si la aplicacion rechaza la subida a
    # mitad de camino, nginx corta la conexion y el navegador no llega a leer
    # el motivo: se ve un error generico en vez del mensaje real.
    location /api/uploads {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_timeout   600s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
    }

    # --- Resto de la API ----------------------------------------------------
    location /api/ {
        limit_req zone=estadisticas_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Aplicacion web -----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
